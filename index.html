<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار قواعد منهج Schritte - الجزء الأول والثاني</title>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Dark Theme Variables */
            --bg-gradient: linear-gradient(180deg, #020307 0%, #060812 50%, #010204 100%);
            --card-bg: rgba(15, 20, 32, 0.9);
            --card-border: rgba(56, 189, 248, 0.25);
            --text-color: #f8fafc;
            --text-sub: #94a3b8;
            --title-color: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #f59e0b 100%);
            --accent-glow: #38bdf8;
            --accent-gold: #f59e0b;
            --accent-red: #f87171;
            --accent-green: #4ade80;
            --button-bg: linear-gradient(135deg, #2563eb, #7c3aed);
            --button-hover: linear-gradient(135deg, #1d4ed8, #6d28d9);
            --glow-color: rgba(56, 189, 248, 0.4);
            --input-bg: rgba(10, 15, 26, 0.95);
            --input-text: #ffffff;
            --chip-bg: rgba(255,255,255,0.05);
        }

        html[data-theme="light"] {
            /* Light Day Theme Variables */
            --bg-gradient: linear-gradient(180deg, #e0f2fe 0%, #f0f9ff 50%, #bae6fd 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-border: rgba(2, 132, 199, 0.3);
            --text-color: #0f172a;
            --text-sub: #334155;
            --title-color: linear-gradient(135deg, #0284c7 0%, #2563eb 50%, #d97706 100%);
            --accent-glow: #0284c7;
            --accent-gold: #d97706;
            --accent-red: #dc2626;
            --accent-green: #16a34a;
            --button-bg: linear-gradient(135deg, #0284c7, #4f46e5);
            --button-hover: linear-gradient(135deg, #0369a1, #4338ca);
            --glow-color: rgba(2, 132, 199, 0.3);
            --input-bg: #ffffff;
            --input-text: #0f172a;
            --chip-bg: rgba(2, 132, 199, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Dark Sky Canvas */
        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Theme Switcher Button (Small & Corner Positioned) */
        .theme-toggle-btn {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1000;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 10px var(--glow-color);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            line-height: 1;
        }

        .theme-toggle-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 25px;
            padding-top: 25px;
        }

        header h1 {
            font-size: 2.1rem;
            background: var(--title-color);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.3));
            font-weight: 800;
        }

        header .author {
            font-size: 1.2rem;
            color: var(--accent-gold);
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
        }

        /* Waving German Flag Box */
        .flag-section {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .flag-frame {
            width: 180px;
            height: 110px;
            border-radius: 12px;
            padding: 6px;
            background: rgba(255,255,255,0.03);
            border: 2px solid #f59e0b;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.6), inset 0 0 15px rgba(245, 158, 11, 0.4);
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.5), inset 0 0 10px rgba(245, 158, 11, 0.3); }
            100% { box-shadow: 0 0 30px rgba(239, 68, 68, 0.8), inset 0 0 20px rgba(56, 189, 248, 0.5); }
        }

        .german-flag {
            width: 100%;
            height: 100%;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            animation: waveFlag 2.5s ease-in-out infinite alternate;
            transform-origin: left center;
        }

        @keyframes waveFlag {
            0% { transform: skewY(0deg) scale(1); }
            50% { transform: skewY(2deg) scale(1.02); }
            100% { transform: skewY(-2deg) scale(0.98); }
        }

        .flag-stripe {
            flex: 1;
        }

        .flag-stripe.black { background-color: #000000; }
        .flag-stripe.red { background-color: #DD0000; }
        .flag-stripe.gold { background-color: #FFCC00; }

        /* Social Contacts Card */
        .contact-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 0 20px var(--glow-color);
        }

        .contact-card h3 {
            margin-bottom: 15px;
            color: var(--accent-glow);
            font-size: 1.3rem;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .social-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            border-radius: 12px;
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .social-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: rotate(30deg);
            animation: shineSocial 3s infinite;
        }

        @keyframes shineSocial {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }

        .social-btn:hover {
            transform: translateY(-3px) scale(1.03);
        }

        .social-btn.telegram { background: linear-gradient(135deg, #0088cc, #00a8ff); }
        .social-btn.tiktok { background: linear-gradient(135deg, #000000, #25f4ee, #fe2c55); }
        .social-btn.instagram { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); }

        /* Shiny Buttons */
        .shiny-btn {
            background: var(--button-bg);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px var(--glow-color);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .shiny-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: rotate(30deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }

        .shiny-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px var(--accent-glow);
        }

        .shiny-btn.active-part {
            background: linear-gradient(135deg, #f59e0b, #d97706) !important;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.6) !important;
        }

        /* Part Selection Dropdown Box */
        .section-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: center;
        }

        .section-box h2 {
            font-size: 1.4rem;
            margin-bottom: 15px;
            color: var(--text-color);
        }

        .parts-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .part-btn {
            flex: 1;
            min-width: 200px;
            padding: 14px;
            font-size: 1.1rem;
        }

        /* Lessons Navigation Bar */
        .lessons-nav {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 5px;
            margin-bottom: 20px;
            scrollbar-width: thin;
        }

        .lesson-tab {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 600;
        }

        .lesson-tab.active {
            background: var(--button-bg);
            box-shadow: 0 0 12px var(--glow-color);
            border-color: transparent;
            color: #fff;
        }

        /* Exercise Container */
        .quiz-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
        }

        .progress-badge {
            background: var(--accent-glow);
            color: #000;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .question-text {
            font-size: 1.25rem;
            margin-bottom: 15px;
            line-height: 1.6;
            font-weight: bold;
        }

        .rule-note {
            font-size: 0.95rem;
            color: var(--accent-gold);
            margin-bottom: 15px;
            background: rgba(245, 158, 11, 0.12);
            padding: 8px 12px;
            border-radius: 8px;
            border-right: 3px solid var(--accent-gold);
        }

        /* Interaction Area */
        .interaction-area {
            margin-bottom: 10px;
        }

        /* Input type */
        .custom-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 2px solid var(--card-border);
            background: var(--input-bg);
            color: var(--input-text);
            font-size: 1.2rem;
            outline: none;
            direction: ltr;
            text-align: left;
            font-weight: 600;
        }

        .custom-input:focus {
            border-color: var(--accent-glow);
            box-shadow: 0 0 12px var(--glow-color);
        }

        /* MCQ Options */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            direction: ltr;
        }

        .option-btn {
            background: var(--chip-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            transition: background 0.2s, border-color 0.2s;
        }

        .option-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: var(--accent-glow);
        }

        .option-btn.selected {
            background: var(--button-bg);
            border-color: transparent;
            color: white;
            box-shadow: 0 0 10px var(--glow-color);
        }

        /* Word Reordering */
        .word-chips-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
            min-height: 55px;
            padding: 12px;
            background: var(--chip-bg);
            border-radius: 10px;
            border: 1px dashed var(--card-border);
            direction: ltr;
            align-items: center;
        }

        .word-chip {
            background: var(--button-bg);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            user-select: none;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            font-size: 1.05rem;
        }

        /* CORRECTION AND EXPLANATION BOX */
        .correction-box {
            margin-top: 15px;
            margin-bottom: 15px;
            padding: 18px;
            border-radius: 14px;
            font-weight: normal;
            text-align: right;
            display: none;
            line-height: 1.7;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .correction-box.incorrect {
            background: rgba(239, 68, 68, 0.12);
            border: 2px solid var(--accent-red);
            color: var(--text-color);
            display: block !important;
        }

        .correction-box.correct {
            background: rgba(34, 197, 94, 0.12);
            border: 2px solid var(--accent-green);
            color: var(--text-color);
            display: block !important;
        }

        .correction-box .box-header {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .correction-box.incorrect .box-header {
            color: var(--accent-red);
        }

        .correction-box.correct .box-header {
            color: var(--accent-green);
        }

        .correction-box .user-answer-line {
            font-size: 1.05rem;
            margin-bottom: 6px;
        }

        .correction-box .correct-answer-line {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 1.15rem;
            font-weight: bold;
            margin: 10px 0;
            direction: ltr;
            text-align: left;
            font-family: 'Segoe UI', Tahoma, monospace;
            border-right: 4px solid var(--accent-gold);
            color: #fde047;
        }

        html[data-theme="light"] .correction-box .correct-answer-line {
            background: #fef9c3;
            color: #854d0e;
        }

        .correction-box .reason-explanation {
            font-size: 1rem;
            margin-top: 8px;
            line-height: 1.6;
        }

        .action-bar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        /* Toast Notification */
        .toast-notification {
            position: fixed;
            top: 25px;
            right: 50%;
            transform: translateX(50%) translateY(-100px);
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid var(--accent-glow);
            color: #fff;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s;
            opacity: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast-notification.show {
            transform: translateX(50%) translateY(0);
            opacity: 1;
        }

        .toast-notification.success {
            border-color: var(--accent-green);
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
        }

        .toast-notification.error {
            border-color: var(--accent-red);
            box-shadow: 0 0 20px rgba(248, 113, 113, 0.4);
        }

        /* Score Box */
        .score-box {
            text-align: center;
            padding: 30px 20px;
        }

        .score-box h2 {
            font-size: 2.2rem;
            margin-bottom: 15px;
        }

        .score-number {
            font-size: 3.5rem;
            font-weight: 800;
            margin: 15px 0;
            text-shadow: 0 0 20px currentColor;
        }

        .status-badge {
            display: inline-block;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 8px 24px;
            border-radius: 30px;
            margin-bottom: 25px;
        }

        .status-badge.pass {
            background: rgba(34, 197, 94, 0.2);
            border: 2px solid var(--accent-green);
            color: var(--accent-green);
        }

        .status-badge.fail {
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid var(--accent-red);
            color: var(--accent-red);
        }
    </style>
</head>
<body>

    <!-- Stars Canvas -->
    <canvas id="stars-canvas"></canvas>

    <!-- Toast Notification -->
    <div id="toast" class="toast-notification">
        <i id="toast-icon" class="fas fa-info-circle"></i>
        <span id="toast-text">اشعار</span>
    </div>

    <!-- Theme Switcher (Day/Night) - Compact & Positioned in Top Corner -->
    <button class="theme-toggle-btn" onclick="toggleTheme()">
        <i class="fas fa-moon" id="theme-icon"></i> <span id="theme-text">الوضع الليلي</span>
    </button>

    <div class="container">
        <!-- Header -->
        <header>
            <h1>اختبار قواعد منهج Schritte</h1>
            <div class="author">إعداد : علي خليل</div>
        </header>

        <!-- Waving German Flag in Glowing Box -->
        <div class="flag-section">
            <div class="flag-frame">
                <div class="german-flag">
                    <div class="flag-stripe black"></div>
                    <div class="flag-stripe red"></div>
                    <div class="flag-stripe gold"></div>
                </div>
            </div>
        </div>

        <!-- Contact Box -->
        <div class="contact-card">
            <h3>للتواصل</h3>
            <div class="social-links">
                <a href="https://t.me/ss4ee1" target="_blank" class="social-btn telegram">
                    <i class="fab fa-telegram-plane fa-lg"></i>
                    <span>تليجرام : ss4ee1</span>
                </a>
                <a href="https://www.tiktok.com/@eezuui" target="_blank" class="social-btn tiktok">
                    <i class="fab fa-tiktok fa-lg"></i>
                    <span>تيكتوك : eezuui</span>
                </a>
                <a href="https://www.instagram.com/eezuui" target="_blank" class="social-btn instagram">
                    <i class="fab fa-instagram fa-lg"></i>
                    <span>انستكرام : eezuui</span>
                </a>
            </div>
        </div>

        <!-- Part Selection Box -->
        <div class="section-box">
            <h2>اختر الجزء</h2>
            <div class="parts-buttons">
                <button class="shiny-btn part-btn active-part" id="part1-btn" onclick="selectPart(1)">تمارين الجزء الأول</button>
                <button class="shiny-btn part-btn" id="part2-btn" onclick="selectPart(2)">تمارين الجزء الثاني</button>
            </div>
        </div>

        <!-- Part 1 Nav -->
        <div id="part1-nav" class="lessons-nav">
            <button class="lesson-tab active" onclick="loadLesson(0)">الدرس 1 (KB 18)</button>
            <button class="lesson-tab" onclick="loadLesson(1)">الدرس 2 (KB 30)</button>
            <button class="lesson-tab" onclick="loadLesson(2)">الدرس 3 (KB 42)</button>
            <button class="lesson-tab" onclick="loadLesson(3)">الدرس 4 (KB 54)</button>
            <button class="lesson-tab" onclick="loadLesson(4)">الدرس 5 (KB 66)</button>
            <button class="lesson-tab" onclick="loadLesson(5)">الدرس 6 (KB 78)</button>
            <button class="lesson-tab" onclick="loadLesson(6)">الدرس 7 (KB 90)</button>
        </div>

        <!-- Part 2 Nav -->
        <div id="part2-nav" class="lessons-nav" style="display: none;">
            <button class="lesson-tab active" onclick="loadLesson(0)">الدرس 8 (KB 102)</button>
            <button class="lesson-tab" onclick="loadLesson(1)">الدرس 9 (KB 114)</button>
            <button class="lesson-tab" onclick="loadLesson(2)">الدرس 10 (KB 126)</button>
            <button class="lesson-tab" onclick="loadLesson(3)">الدرس 11 (KB 138)</button>
            <button class="lesson-tab" onclick="loadLesson(4)">الدرس 12 (KB 150)</button>
            <button class="lesson-tab" onclick="loadLesson(5)">الدرس 13 (KB 162)</button>
            <button class="lesson-tab" onclick="loadLesson(6)">الدرس 14 (KB 174)</button>
        </div>

        <!-- Unified Quiz Container -->
        <div id="quiz-container">
            <div class="quiz-card" id="quiz-box">
                <div class="quiz-header">
                    <span id="lesson-title" style="font-weight: bold; color: var(--accent-glow);">الدرس 1</span>
                    <span class="progress-badge" id="progress-text">سؤال 1 / 25</span>
                </div>

                <div class="rule-note">
                    <i class="fas fa-exclamation-triangle me-1"></i> تنبيه هام: يراعى دقة تصريف الفعل والحروف الكبيرة (Großschreibung) للأسماء وبداية الجمل.
                </div>

                <div class="question-text" id="question-text">جاري تحميل السؤال...</div>

                <!-- Input / Interaction Area -->
                <div class="interaction-area" id="interaction-area">
                    <!-- Dynamic question content injected here -->
                </div>

                <!-- CORRECTION & EXPLANATION BOX -->
                <div class="correction-box" id="correction-box"></div>

                <!-- Action Bar Buttons -->

        // Web Audio API Synthesizer for UI Sounds
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.04);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
                osc.start(now);
                osc.stop(now + 0.04);
            } else if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now); // A3
                osc.frequency.setValueAtTime(160, now + 0.12);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            }
        }

            const toast = document.getElementById('toast');

            text.innerText = message;
            toast.className = 'toast-notification ' + (isSuccess ? 'success' : 'error');
            icon.className = isSuccess ? 'fas fa-check-circle' : 'fas fa-times-circle';

            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2200);
        }

        // Dark Sky Canvas with Stars
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 40; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.2 + 0.4,
                alpha: Math.random(),
                speed: Math.random() * 0.008 + 0.003
            });
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(224, 242, 254, ${Math.abs(Math.sin(star.alpha)) * 0.7})`;
                ctx.fill();
                star.alpha += star.speed;
            });
            requestAnimationFrame(drawStars);
        }

                    { type: 'reorder', question: 'رتب الجملة مع الفعل gehören والضمير mir:', words: ['gehört', 'mir.', 'Auto', 'Das'], answer: 'Das Auto gehört mir.', exp: 'Das Auto فاعل، gehört فعل Dativ، mir مفعول به.' },
                    { type: 'fill', question: 'صغ المقارنة (Komparativ) من الصفة klein: klein -> _____', answer: 'kleiner', exp: 'صفة قياسية نضيف لها er فتصبح kleiner.' },
                    { type: 'mcq', question: 'أي الجمل التالية صحيحة مع الفعل danken الذي يتطلب Dativ؟', options: ['Ich danke Ihnen.', 'Ich danke Sie.', 'Ich danke du.'], answer: 'Ich danke Ihnen.', exp: 'الفعل danken يتطلب Dativ فتتحول Sie إلى Ihnen.' },
                    { type: 'fill', question: 'أكمل: Ich helfe _____ Kind.', answer: 'dem', exp: 'Kind محايد، وبعد helfen نستخدم Dativ: dem Kind.' },
                    { type: 'mcq', question: 'الفعل helfen يتطلب عادة:', options: ['Dativ', 'Akkusativ', 'Nominativ فقط'], answer: 'Dativ', exp: 'helfen من الأفعال التي تأخذ مفعولًا في Dativ.' },
                    { type: 'reorder', question: 'رتب المقارنة:', words: ['Anna', 'ist', 'größer', 'als', 'Lisa.'], answer: 'Anna ist größer als Lisa.', exp: 'في المقارنة نستخدم صيغة المقارنة + als.' },
                    { type: 'tf', question: 'صيغة المقارنة الأكبر من الصفة groß هي größer.', options: ['صح', 'خطأ'], answer: 'صح', exp: 'groß تصبح größer في Komparativ.' },
                    { type: 'fill', question: 'أكمل التفضيل: Das ist _____ beste Buch.', answer: 'das', exp: 'في صيغة Superlativ الاسمية نقول das beste Buch.' },
                    { type: 'mcq', question: 'ما صيغة المقارنة من klein؟', options: ['kleiner', 'kleinste', 'kleinen'], answer: 'kleiner', exp: 'Komparativ من klein هو kleiner.' },
                    { type: 'reorder', question: 'رتب الجملة:', words: ['Er', 'ist', 'schneller', 'als', 'ich.'], answer: 'Er ist schneller als ich.', exp: 'صيغة المقارنة schneller تتبعها als عند المقارنة بين شخصين.' },
                    { type: 'fill', question: 'أكمل: Maria ist _____ als Anna. (jung)', answer: 'jünger', exp: 'jung تصبح jünger في Komparativ مع تغيير u إلى ü.' },
                    { type: 'mcq', question: 'صيغة Superlativ من gut هي:', options: ['am besten', 'am guter', 'am gutsten'], answer: 'am besten', exp: 'gut من الصفات الشاذة، وصيغة التفضيل هي am besten.' },
                    { type: 'tf', question: 'تُستخدم als مع صيغة المقارنة عند المقارنة بين شيئين.', options: ['صح', 'خطأ'], answer: 'صح', exp: 'مثل: größer als، schneller als.' }
                ]
            },
            // Lesson 14 (KB 174)
            {
                title: "الدرس 14 (KB 174): الجملة الجانبية بـ weil والماضي للأفعال الناقصة",
                questions: [
                    { type: 'mcq', question: 'في الجملة الفرعية المسبوقة بالرابط (weil)، يقع الفعل المصرف دائماً في:', options: ['نهاية الجملة', 'المركز الثاني', 'بداية الجملة'], answer: 'نهاية الجملة', exp: 'الرابط weil يبني جملة فرعية (Nebensatz) يرحل فيها الفعل المصرف لنهايتها.' },
                    { type: 'fill', question: 'الماضي (Präteritum) من الفعل الناقص können مع الضمير ich/er/sie هو: _____', answer: 'konnte', exp: 'يفقد يمكن Umlaut بالماضي ليصبح konnte.' },
                    { type: 'tf', question: 'الأفعال الناقصة Modalverben في زمن الماضي Präteritum تتخلى تماماً عن التشكيل (Umlaut).', options: ['صح', 'خطأ'], answer: 'صح', exp: 'قاعدة ثابتة: جميع الأفعال الناقصة تفقد Umlaut بالماضي Präteritum.' },
                    { type: 'reorder', question: 'رتب الجملة الجانبية مع لأن (weil) باحترام مكان الفعل بالمرتبة الأخيرة:', words: ['krank', 'Ich', 'zu', 'Hause,', 'bin.', 'bleibe', 'weil', 'ich'], answer: 'Ich bleibe zu Hause, weil ich krank bin.', exp: 'الرابط weil يضع الفعل bin في نهاية الجملة تماماً.' },
                    { type: 'fill', question: 'الماضي (Präteritum) من الفعل الناقص müssen مع الضمير ich/er/sie هو: _____', answer: 'musste', exp: 'يفقد يجب Umlaut بالماضي ليصبح musste.' },
                    { type: 'mcq', question: 'الماضي من الفعل الناقص wollen مع الضمير ich هو:', options: ['wollte', 'wollten', 'wollst'], answer: 'wollte', exp: 'الماضي من wollen هو wollte.' },
                    { type: 'fill', question: 'اكتب تصريف konnte مع الضمير du: Du _____ gestern nicht kommen.', answer: 'konntest', exp: 'مع الضمير du يأخذ الماضي من können النهاية est فتصبح konntest.' },
                    { type: 'reorder', question: 'رتب الجملة في الماضي Präteritum مع (musste):', words: ['arbeiten.', 'gestern', 'musste', 'viel', 'Er'], answer: 'Er musste gestern viel arbeiten.', exp: 'Er فاعل، musste بالمركز الثاني، والمصدر arbeiten بالنهاية.' },
                    { type: 'mcq', question: 'اختر رابط السبب الصحيح للجملة (Ich lerne Deutsch, _____ ich in Deutschland leben will.):', options: ['weil', 'und', 'aber'], answer: 'weil', exp: 'نستخدم weil للربط وإعطاء السبب مع نقل الفعل المصرف للنهاية.' },
                    { type: 'tf', question: 'توضع فاصلة (Komma) قبل حرف الربط (weil) دائماً في اللغة الألمانية.', options: ['صح', 'خطأ'], answer: 'صح', exp: 'قاعدة ترقيم: الفاصلة إجبارية قبل الجمل الفرعية المسبوقة بـ weil.' },
                    { type: 'fill', question: 'تصريف musste مع الضمير du هو: Du _____ lange warten.', answer: 'musstest', exp: 'مع الضمير du يصبح تصريف musste هو musstest.' },
                    { type: 'mcq', question: 'الماضي من الفعل الناقص sollen مع الضمير er هو:', options: ['sollte', 'sollten', 'sollt'], answer: 'sollte', exp: 'الماضي من sollen مع er هو sollte.' },
                    { type: 'reorder', question: 'رتب جملة السبب مع weil باحترام مكان الفعل بالمرتبة الأخيرة (hat):', words: ['hat.', 'Zeit', 'keine', 'Er', 'weil', 'er', 'kommt', 'nicht,'], answer: 'Er comes nicht, weil er keine Zeit hat.', exp: 'Er kommt nicht, weil er keine Zeit hat.' },
                    { type: 'fill', question: 'اكتب تصريف konnte مع الضمير wir: Wir _____ das nicht machen.', answer: 'konnten', exp: 'مع الضمير wir يأخذ الماضي من können النهاية en فتصبح konnten.' },
                    { type: 'mcq', question: 'الماضي من الفعل الناقص dürfen مع الضمير ich هو:', options: ['durfte', 'dürfte', 'durften'], answer: 'durfte', exp: 'يفقد dürfen التشكيل Umlaut في الماضي ليصبح durfte.' },
                    { type: 'fill', question: 'أكمل الجملة بـ weil: Ich bleibe zu Hause, weil ich krank _____.', answer: 'bin', exp: 'في الجملة الجانبية مع weil يأتي الفعل المصرف في النهاية.' },
                    { type: 'mcq', question: 'أين يأتي الفعل المصرف في جملة weil؟', options: ['في النهاية', 'في المركز الأول', 'في المركز الثاني'], answer: 'في النهاية', exp: 'weil تدخل Nebensatz، والفعل المصرف يأتي في نهايتها.' },
                    { type: 'reorder', question: 'رتب الجملة الجانبية:', words: ['weil', 'ich', 'müde', 'bin.'], answer: 'weil ich müde bin.', exp: 'بعد weil يأتي الفاعل ثم باقي عناصر الجملة والفعل المصرف في النهاية.' },
                    { type: 'tf', question: 'في الجملة الجانبية بـ weil يأتي الفعل المصرف في النهاية.', options: ['صح', 'خطأ'], answer: 'صح', exp: 'هذه قاعدة أساسية في Nebensatz مع weil.' },
                    { type: 'fill', question: 'أكمل الماضي لـ können مع ich: Ich _____ nicht kommen.', answer: 'konnte', exp: 'الماضي البسيط لـ können مع ich هو konnte.' },
                    { type: 'mcq', question: 'الماضي البسيط لـ müssen مع ich هو:', options: ['musste', 'muss', 'mussten'], answer: 'musste', exp: 'Präteritum لـ müssen مع ich هو musste.' },
                    { type: 'reorder', question: 'رتب:', words: ['Ich', 'musste', 'gestern', 'arbeiten.'], answer: 'Ich musste gestern arbeiten.', exp: 'musste هو الماضي البسيط لـ müssen، والمصدر يأتي في النهاية.' },
                    { type: 'fill', question: 'أكمل: Er _____ nicht kommen. (können في الماضي)', answer: 'konnte', exp: 'مع er يكون الماضي البسيط من können: konnte.' },
                    { type: 'mcq', question: 'أي جملة صحيحة مع weil؟', options: ['Ich gehe, weil ich Zeit habe.', 'Ich gehe, weil habe ich Zeit.', 'Ich gehe, weil ich habe Zeit.'], answer: 'Ich gehe, weil ich Zeit habe.', exp: 'الفعل habe يأتي في نهاية الجملة الجانبية.' },
                    { type: 'tf', question: 'الماضي البسيط لـ müssen مع wir هو mussten.', options: ['صح', 'خطأ'], answer: 'صح', exp: 'تصريف mussten هو الماضي البسيط لـ müssen مع wir.' }
                ]
            }
        ];

        let currentPart = 1;
        let currentLessonIdx = 0;
        let currentQuestionIdx = 0;
        let selectedOption = null;
        let score = 0;

        function selectPart(partNum) {
            currentPart = partNum;
            
            const btn1 = document.getElementById('part1-btn');
            const btn2 = document.getElementById('part2-btn');
            const nav1 = document.getElementById('part1-nav');
            const nav2 = document.getElementById('part2-nav');

            if (partNum === 1) {
                btn1.classList.add('active-part');
                btn2.classList.remove('active-part');
                nav1.style.display = 'flex';
                nav2.style.display = 'none';
            } else {
                btn2.classList.add('active-part');
                btn1.classList.remove('active-part');
                nav2.style.display = 'flex';
                nav1.style.display = 'none';
            }

            loadLesson(0);
        }

        function getCurrentData() {
            return currentPart === 1 ? lessonsDataPart1 : lessonsDataPart2;
        }

        function loadLesson(index) {
            currentLessonIdx = index;
            currentQuestionIdx = 0;
            score = 0;

            const activeNav = currentPart === 1 ? document.getElementById('part1-nav') : document.getElementById('part2-nav');
            const tabs = activeNav.querySelectorAll('.lesson-tab');
            tabs.forEach((tab, i) => {
                if (i === index) tab.classList.add('active');
                else tab.classList.remove('active');
            });

            const data = getCurrentData();
            document.getElementById('lesson-title').innerText = data[index].title;
            renderQuestion();
        }

        function renderQuestion() {
            const data = getCurrentData();
            const lesson = data[currentLessonIdx];
            const q = lesson.questions[currentQuestionIdx];

            document.getElementById('progress-text').innerText = `سؤال ${currentQuestionIdx + 1} / ${lesson.questions.length}`;
            document.getElementById('question-text').innerText = q.question;

            const area = document.getElementById('interaction-area');
            area.innerHTML = '';
            
            // Hide correction box on render
            const correctionBox = document.getElementById('correction-box');
            correctionBox.className = 'correction-box';
            correctionBox.style.display = 'none';
            correctionBox.innerHTML = '';

            document.getElementById('check-btn').style.display = 'inline-block';
            document.getElementById('next-btn').style.display = 'none';
            selectedOption = null;

            if (q.type === 'fill') {
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'custom-input';
                input.id = 'fill-answer';
                input.placeholder = 'اكتب اجابتك هنا !';
                input.autocomplete = 'off';
                
                input.addEventListener('keyup', function(event) {
                    if (event.key === 'Enter') {
                        checkAnswer();
                    }
                });

                area.appendChild(input);
            } else if (q.type === 'mcq' || q.type === 'tf') {
                const grid = document.createElement('div');
                grid.className = 'options-grid';
                q.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt;
                    btn.onclick = () => {
                        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        selectedOption = opt;
                    };
                    grid.appendChild(btn);
                });
                area.appendChild(grid);
            } else if (q.type === 'reorder') {
                const targetArea = document.createElement('div');
                targetArea.className = 'word-chips-container';
                targetArea.id = 'target-words';

                const sourceArea = document.createElement('div');
                sourceArea.className = 'word-chips-container';
                sourceArea.id = 'source-words';

                let shuffled = [...q.words].sort(() => Math.random() - 0.5);

                shuffled.forEach((word) => {
                    const chip = document.createElement('div');
                    chip.className = 'word-chip';
                    chip.innerText = word;
                    chip.onclick = () => {
                        if (chip.parentElement.id === 'source-words') {
                            targetArea.appendChild(chip);
                        } else {
                            sourceArea.appendChild(chip);
                        }
                    };
                    sourceArea.appendChild(chip);
                });

                area.appendChild(targetArea);
                area.appendChild(sourceArea);
            }
        }

        function checkAnswer() {
            const data = getCurrentData();
            const lesson = data[currentLessonIdx];
            const q = lesson.questions[currentQuestionIdx];
            const correctionBox = document.getElementById('correction-box');
            let isCorrect = false;
            let userAns = '';

            if (q.type === 'fill') {
                const input = document.getElementById('fill-answer');
                userAns = input ? input.value.trim() : '';
                if (userAns === q.answer) {
                    isCorrect = true;
                }
            } else if (q.type === 'mcq' || q.type === 'tf') {
                userAns = selectedOption;
                if (userAns === q.answer) {
                    isCorrect = true;
                }
            } else if (q.type === 'reorder') {
                const targetChips = document.querySelectorAll('#target-words .word-chip');
                let wordsArr = [];
                targetChips.forEach(c => wordsArr.push(c.innerText));
                userAns = wordsArr.join(' ').trim();
                if (userAns === q.answer.trim()) {
                    isCorrect = true;
                }
            }

            correctionBox.style.display = 'block';

            if (isCorrect) {
                playSound('correct');
                showToast('إجابة صحيحة! أحسنت 👏', true);

                correctionBox.className = 'correction-box correct';
                correctionBox.innerHTML = `
                    <div class="box-header">
                        <i class="fas fa-check-circle"></i>
                        <span>إجابتك صحيحة! أحسنت 👏</span>
                    </div>
                    <div class="correct-answer-line">
                        ✓ الحل المطلوب: ${q.answer}
                    </div>
                    <div class="reason-explanation">
                        💡 <strong>توضيح القاعدة النحوية الصحيحة:</strong><br>
                        ${q.exp}
                    </div>
                `;
                score++;
            } else {
                playSound('error');
                showToast('إجابة خاطئة!', false);

                let userDisplay = userAns ? `<span style="text-decoration: line-through; opacity: 0.85; font-weight: bold; color: var(--accent-red);">${userAns}</span>` : '<span style="color: var(--accent-gold);">(لم تقم بإدخال إجابة)</span>';

                correctionBox.className = 'correction-box incorrect';
                correctionBox.innerHTML = `
                    <div class="box-header">
                        <i class="fas fa-times-circle"></i>
                        <span>تنبيه: الإجابة خاطئة!</span>
                    </div>
                    <div class="user-answer-line">
                        ❌ <strong>إجابتك التي أدخلتها:</strong> ${userDisplay}
                    </div>
                    <div class="correct-answer-line">
                        ✓ الجواب الصحيح: ${q.answer}
                    </div>
                    <div class="reason-explanation">
                        💡 <strong>سبب الخطأ وشرح القاعدة النحوية بالتفصيل:</strong><br>
                        ${q.exp}
                        <br><small style="color: var(--text-sub); display: block; margin-top: 6px;">(تنبيه: راعِ كتابة الأسماء وبداية الجمل بالحرف الكبير Großschreibung ودقة التشكيل/التصريف).</small>
                    </div>
                `;
            }

            document.getElementById('check-btn').style.display = 'none';
            document.getElementById('next-btn').style.display = 'inline-block';
        }

        function nextQuestion() {
            const data = getCurrentData();
            const lesson = data[currentLessonIdx];
            currentQuestionIdx++;

            if (currentQuestionIdx < lesson.questions.length) {
                renderQuestion();
            } else {
                const finalGrade = Math.round((score / 25) * 100);
                const isPassed = finalGrade >= 50;
                
                const quizBox = document.getElementById('quiz-box');
                quizBox.innerHTML = `
                    <div class="score-box">
                        <i class="fas ${isPassed ? 'fa-award' : 'fa-times-circle'} fa-4x" style="color: ${isPassed ? 'var(--accent-gold)' : 'var(--accent-red)'}; margin-bottom: 15px;"></i>
                        <h2>نتيجة ${lesson.title}</h2>
                        
                        <div class="score-number" style="color: ${isPassed ? 'var(--accent-green)' : 'var(--accent-red)'};">
                            ${finalGrade} / 100
                        </div>

                        <div class="status-badge ${isPassed ? 'pass' : 'fail'}">
                            ${isPassed ? 'النتيجة: ناجح 🎉' : 'النتيجة: راسب ❌'}
                        </div>

                        <p style="font-size: 1.15rem; color: var(--text-sub); margin-bottom: 25px;">
                            أجبت على <strong>${score}</strong> من أصل <strong>25</strong> سؤالاً بشكل صحيح.
                        </p>

                        <button class="shiny-btn" onclick="location.reload()">
                            <i class="fas fa-redo me-2"></i> العودة للاختبارات
                        </button>
                    </div>
                `;
            }
        }

        // Initialize default Part 1
        window.onload = () => {
            selectPart(1);
        };
    </script>
</body>
</html>
